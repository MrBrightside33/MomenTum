services:
  node:
    image: node:22-alpine
    container_name: tm_node
    working_dir: /var/www
    volumes:
      - .:/var/www
    profiles: ["tools"]

    
  app:
    build: .
    container_name: tm_app
    command: php-fpm -d opcache.validate_timestamps=0 -d realpath_cache_size=4096K -d realpath_cache_ttl=600
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully


  migrate:
    build: .
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"


  nginx:
    image: nginx:alpine
    container_name: tm_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app


  db:
    image: mysql:8.0
    command: --skip-name-resolve
    container_name: tm_db
    environment:
      MYSQL_DATABASE: task_manager
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: tm_phpmyadmin
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    depends_on:
      - db


volumes:
  dbdata: